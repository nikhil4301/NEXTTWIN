<head>

  <title>NextTwin — Digital Academic Twin</title>
  <script>window.__NEXTTWIN_API__ = ""; /* DEPLOY: put your backend address here, e.g. "https://your-app.up.railway.app/api" */</script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    :root {
      --bg:       #0a0e1a;
      --surface:  #111827;
      --card:     #1a2235;
      --border:   #243047;
      --accent:   #6366f1;
      --accent2:  #22d3ee;
      --accent3:  #a78bfa;
      --green:    #10b981;
      --yellow:   #f59e0b;
      --red:      #ef4444;
      --text:     #f1f5f9;
      --muted:    #64748b;

      --radius-lg:18px;

    html { scroll-behavior: smooth; }
    body {

      color: var(--text);

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const { AreaChart, Area, BarChart, Bar, RadarChart, Radar, PolarGrid, PolarAngleAxis,
        LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend } = Recharts;

// Auto-detect API URL:
// - In production (deployed on Railway etc.), set window.__NEXTTWIN_API__ manually.
// - When running locally via start.py, backend is always on port 8000.
// - To override, add a script tag setting window.__NEXTTWIN_API__ to your backend URL
//   before this script tag in the HTML head.
const API = (
  window.__NEXTTWIN_API__ ||
  (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    ? `http://localhost:8000/api`
    : `${window.location.protocol}//${window.location.hostname}/api`)
);

// ─── API Helper ────────────────────────────────────────────────────────────────
// Tracks which account is currently logged in.
// Set on login/signup, cleared on sign out. Every api() call below
// automatically scopes requests to this user so accounts stay independent.
let CURRENT_USER_ID = null;

async function api(path, method = "GET", body = null) {
  let url = API + path;
  if (CURRENT_USER_ID) {
    if (method === "GET") {
      url += (url.includes("?") ? "&" : "?") + "user_id=" + encodeURIComponent(CURRENT_USER_ID);
    } else {
      body = { ...(body || {}), user_id: CURRENT_USER_ID };
    }
  }
  const opts = {
    method,
    headers: { "Content-Type": "application/json" },
    ...(body ? { body: JSON.stringify(body) } : {})
  };
  try {
    const res = await fetch(url, opts);
    return await res.json();
  } catch (e) {
    console.warn("API error:", e);
    return null;
  }
}

// ─── College Portal Screenshot Scanner (in-browser OCR) ────────────────────────
// Runs entirely client-side via Tesseract.js — the image never leaves the browser.
async function scanImageText(file, onProgress) {
  if (typeof Tesseract === "undefined") {
    throw new Error("OCR engine failed to load from CDN — check your internet connection and reload the page.");
  }
  const worker = await Tesseract.createWorker("eng", 1, {
    logger: (m) => {
      if (onProgress && m.status && typeof m.progress === "number") {
        onProgress(`${m.status.replace(/_/g, " ")}… ${Math.round(m.progress * 100)}%`);
      }
    }
  });
  try {
    const { data } = await worker.recognize(file);
    return data.text || "";
  } finally {
    await worker.terminate();
  }
}

// The set of grade values this parser recognizes as a valid last column —
// covers standard letter grades plus common non-graded pass markers.
const KNOWN_GRADES = new Set([
  "O", "A+", "A", "B+", "B", "C+", "C", "D", "E", "F",
  "QUALIFIED", "PASS", "NP", "P"
]);

// Best-effort parser for grade-sheet style tables (Subject Code | Subject Name | Credits | Grade),
// grouped under "Semester : N" section headers — the common layout on most college portals.
// Splits on ANY whitespace run rather than requiring double-spaces, since OCR output
// spacing is unpredictable. Preserves the real subject code / credits / grade values
// exactly as shown on the portal — no conversion happens here. Always returns rows into
// an EDITABLE table so misreads can be fixed before saving.
function parseAcademicText(text) {
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const rows = [];
  let currentSem = 1; // used only if no "Semester : N" header is found in the scanned text at all
  // Subject codes look like "23CSH-307", "23CSH307", "23TDP-361" — 2 digits, 2-6 letters,
  // optional hyphen, 2-4 digits. OCR sometimes drops the hyphen, so it's optional here.
  const CODE_RE = /^[0-9]{2}[A-Z]{2,6}-?[0-9]{2,4}$/i;

  for (const line of lines) {
    const semMatch = line.match(/Semester\s*:?\s*(\d+)/i);
    if (semMatch) { currentSem = Math.min(8, Math.max(1, parseInt(semMatch[1], 10))); continue; }
    if (/subject\s*code/i.test(line) || /subject\s*name/i.test(line)) continue; // header row
    if (/^credits?$/i.test(line) || /^grade$/i.test(line)) continue; // stray header token on its own line

    const tokens = line.split(/\s+/).map(t => t.trim()).filter(Boolean);
    if (tokens.length < 2) continue;

    const lastRaw = tokens[tokens.length - 1].toUpperCase();
    const lastClean = lastRaw.replace(/[^A-Z+]/g, "");
    if (!KNOWN_GRADES.has(lastClean)) continue; // last column must look like a real grade

    // Display "Qualified"/"Pass" with normal casing instead of shouting caps
    const grade = (lastClean === "QUALIFIED") ? "Qualified"
                 : (lastClean === "PASS" || lastClean === "P") ? "Pass"
                 : lastRaw;

    let rest = tokens.slice(0, -1); // drop grade
    let subjectCode = "";
    if (rest.length > 1 && CODE_RE.test(rest[0])) {
      subjectCode = rest[0].toUpperCase();
      rest = rest.slice(1);
    }
    let credits = "";
    if (rest.length > 1 && /^[\d.]+$/.test(rest[rest.length - 1])) {
      credits = rest[rest.length - 1];
      rest = rest.slice(0, -1);
    }

    const subject = rest.join(" ").replace(/\s+/g, " ").trim();
    if (!subject || subject.length < 2) continue;

    rows.push({
      subject_code: subjectCode,
      subject,
      credits,
      grade,
      semester: String(currentSem)
    });
  }
  return rows;
}

// ─── Toast ─────────────────────────────────────────────────────────────────────
function Toast({ msg, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
  return <div className="toast">✅ {msg}</div>;
}

// ─── Spinner ───────────────────────────────────────────────────────────────────
function Spinner() { return <div className="spinner" />; }

// ── XAI Factor Row ─────────────────────────────────────────────────────────────
function XAIFactor({ factor }) {
  const color = factor.direction === "positive" ? "#10b981" : factor.direction === "negative" ? "#ef4444" : "#f59e0b";
  return (
    <div className="xai-factor">
      <div className="xai-dot" style={{ background: color }} />
      <div style={{ flex: 1 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
          <span style={{ fontSize:13, fontWeight:700 }}>{factor.factor}</span>
          <span style={{ fontSize:12, color, fontWeight:700 }}>{factor.score ?? factor.impact}%</span>
        </div>
        <p style={{ fontSize:12, color:"var(--muted)" }}>{factor.description}</p>
        {factor.weight && <div style={{ marginTop:6 }}>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
            <span style={{ fontSize:11, color:"var(--muted)" }}>Weight: {factor.weight}</span>
          </div>
          <div className="progress-bar">
            <div className="progress-fill" style={{ width: (factor.score ?? factor.impact) + "%", background: color }} />
          </div>
        </div>}
      </div>
    </div>
  );
}

// ─── LOGIN PAGE ────────────────────────────────────────────────────────────────
function LoginPage({ onLogin }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [branch, setBranch] = useState("Computer Science");
  const [semester, setSemester] = useState("1");
  const [cgpa, setCgpa] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  function fillDemoCredentials() {
    setMode("login");
    setEmail("demo@nexttwin.ai");
    setPassword("demo1234");
    setErr("");
  }

  async function handleLogin() {
    setLoading(true); setErr("");
    const res = await api("/auth/login", "POST", { email, password });
    setLoading(false);
    if (res?.success) onLogin(res.user);
    else setErr(res?.error || "Login failed. Try demo@nexttwin.ai / demo1234");
  }

  async function handleSignup() {
    if (!name || !email || !password) {
      setErr("Please fill in name, email, and password.");
      return;
    }
    setLoading(true); setErr("");
    const res = await api("/auth/register", "POST", {
      name, email, password, branch,
      semester: +semester || 1,
      cgpa: +cgpa || 0
    });
    if (!res?.success) {
      setLoading(false);
      setErr(res?.error || "Registration failed. Try a different email.");
      return;
    }
    // Auto-login right after successful registration
    const loginRes = await api("/auth/login", "POST", { email, password });
    setLoading(false);
    if (loginRes?.success) onLogin(loginRes.user);
    else { setMode("login"); setErr("Account created! Please sign in."); }
  }

  function switchMode(next) {
    setMode(next);
    setErr("");
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">
          <div className="login-logo-title">🧬 NextTwin</div>
          <div className="login-logo-sub">Your Personalized Digital Academic Twin</div>
        </div>

        <div style={{ display:"flex", gap:8, marginBottom:18, background:"var(--surface)", borderRadius:10, padding:4 }}>
          <button
            onClick={() => switchMode("login")}
            className="btn"
            style={{
              flex:1, justifyContent:"center",
              background: mode === "login" ? "var(--accent)" : "transparent",
              color: mode === "login" ? "#fff" : "var(--muted)",
              border:"none"
            }}>
            Sign In
          </button>
          <button
            onClick={() => switchMode("signup")}
            className="btn"
            style={{
              flex:1, justifyContent:"center",
              background: mode === "signup" ? "var(--accent)" : "transparent",
              color: mode === "signup" ? "#fff" : "var(--muted)",
              border:"none"
            }}>
            Sign Up
          </button>
        </div>

        {mode === "signup" && (
          <div className="form-group">
            <label className="form-label">Full Name</label>
            <input className="form-input" value={name} onChange={e => setName(e.target.value)} placeholder="Your name" />
          </div>
        )}

        <div className="form-group">
          <label className="form-label">Email</label>
          <input className="form-input" value={email} onChange={e => setEmail(e.target.value)} placeholder="email@example.com" />
        </div>
        <div className="form-group">
          <label className="form-label">Password</label>
          <input className="form-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" />
        </div>

        {mode === "signup" && (
          <>
            <div className="form-group">
              <label className="form-label">Branch</label>
              <input className="form-input" value={branch} onChange={e => setBranch(e.target.value)} placeholder="e.g. Computer Science" />
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <div className="form-group" style={{ flex:1 }}>
                <label className="form-label">Semester</label>
                <input className="form-input" type="number" min="1" max="8" value={semester} onChange={e => setSemester(e.target.value)} placeholder="1" />
              </div>
              <div className="form-group" style={{ flex:1 }}>
                <label className="form-label">Current CGPA</label>
                <input className="form-input" type="number" step="0.1" min="0" max="10" value={cgpa} onChange={e => setCgpa(e.target.value)} placeholder="e.g. 7.5" />
              </div>
            </div>
          </>
        )}

        {err && <div style={{ color:"var(--red)", fontSize:13, marginBottom:12 }}>{err}</div>}

        <button
          className="btn btn-primary"
          style={{ width:"100%", justifyContent:"center" }}
          onClick={mode === "login" ? handleLogin : handleSignup}
          disabled={loading}>
          {loading ? <Spinner /> : (mode === "login" ? "Sign In" : "Create Account")}
        </button>

        <div className="divider" />
        {mode === "login" ? (
          <div style={{ textAlign:"center" }}>
            <button
              onClick={fillDemoCredentials}
              style={{
                background:"none", border:"none", color:"var(--accent2)",
                fontSize:12, cursor:"pointer", textDecoration:"underline"
              }}>
              Use demo account instead (demo@nexttwin.ai)
            </button>
          </div>
        ) : (
          <p style={{ fontSize:12, color:"var(--muted)", textAlign:"center" }}>
            After signing up, add your own skills, marks, and activities from scratch.
          </p>
        )}
      </div>
    </div>
  );
}

// ─── ACADEMIC PAGE ─────────────────────────────────────────────────────────────
function AcademicPage() {
  const [records, setRecords] = useState([]);
  const [prediction, setPrediction] = useState(null);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ subject_code:"", subject:"", credits:"", grade:"B", semester:"1" });
  const [toast, setToast] = useState("");

  // ── College Portal Screenshot Import ──
  const [showImport, setShowImport] = useState(false);
  const [screenshotUrl, setScreenshotUrl] = useState(null);
  const [importRows, setImportRows] = useState([
    { subject_code:"", subject:"", credits:"", grade:"B", semester:"1" }
  ]);
  const [importing, setImporting] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [scanNote, setScanNote] = useState("");
  const [rawScanText, setRawScanText] = useState("");

  useEffect(() => {
    Promise.all([api("/academic/records"), api("/predict/cgpa")]).then(([r, p]) => {
      setRecords(r?.records || []);
      setPrediction(p);
      setLoading(false);
    });
  }, []);

  async function addRecord() {
    if (!form.subject || !form.grade) return;
    await api("/academic/add", "POST", { ...form, credits: +form.credits || 0, semester: +form.semester });
    setToast("Academic record added!");
    const r = await api("/academic/records");
    const p = await api("/predict/cgpa");
    setRecords(r?.records || []);
    setPrediction(p);
    setForm({ subject_code:"", subject:"", credits:"", grade:"B", semester:"1" });
  }

  async function handleScreenshotSelect(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    // Preview only, in-browser — the image is never uploaded or stored anywhere.
    const url = URL.createObjectURL(file);
    setScreenshotUrl(url);
    setShowImport(true);
    setScanning(true);
    setRawScanText("");
    setScanNote("Loading OCR engine…");
    // Clear any rows left over from a previous scan so old data can never
    // be mistaken for a result of this new image.
    setImportRows([{ subject_code:"", subject:"", credits:"", grade:"B", semester:"1" }]);

    try {
      const text = await scanImageText(file, (progressMsg) => setScanNote(progressMsg));
      setRawScanText(text);
      const parsedRows = parseAcademicText(text);
      if (parsedRows.length > 0) {
        setImportRows(parsedRows);
        setScanNote(`Found ${parsedRows.length} subject${parsedRows.length === 1 ? "" : "s"} — please review before saving.`);
      } else if (text.trim().length > 0) {
        setScanNote("Text was read from the image, but no subject/grade rows matched the expected format. See the raw scanned text below, and fill in the table manually.");
      } else {
        setScanNote("No text could be read from this image at all — try a clearer or higher-resolution screenshot, or fill in the table manually below.");
      }
    } catch (err) {
      console.error("OCR failed:", err);
      setScanNote(`Scan failed: ${err.message || "unknown error"}. Please fill in the table manually below.`);
    } finally {
      setScanning(false);
    }
  }

  function updateImportRow(i, field, value) {
    const next = [...importRows];
    next[i] = { ...next[i], [field]: value };
    setImportRows(next);
  }

  function addImportRow() {
    setImportRows([...importRows, { subject_code:"", subject:"", credits:"", grade:"B", semester:"1" }]);
  }

  function removeImportRow(i) {
    setImportRows(importRows.filter((_, idx) => idx !== i));
  }

  async function submitImport() {
    const validRows = importRows
      .filter(r => r.subject.trim() && r.grade)
      .map(r => ({
        subject_code: r.subject_code.trim(),
        subject: r.subject.trim(),
        credits: +r.credits || 0,
        grade: r.grade,
        semester: +r.semester
      }));
    if (validRows.length === 0) {
      setToast("Fill in at least one subject and grade before saving.");
      return;
    }
    setImporting(true);
    const res = await api("/academic/bulk-add", "POST", { records: validRows });
    setImporting(false);
    if (res?.success) {
      setToast(`Added ${res.inserted} record${res.inserted === 1 ? "" : "s"} successfully!`);
      setImportRows([{ subject_code:"", subject:"", credits:"", grade:"B", semester:"1" }]);
      setShowImport(false);
      setScreenshotUrl(null);
      const r = await api("/academic/records");
      const p = await api("/predict/cgpa");
      setRecords(r?.records || []);
      setPrediction(p);
    } else {
      setToast("Import failed — check your entries and try again.");
    }
  }

  // group by semester for chart
  const semData = {};
  records.forEach(r => {
    if (!semData[r.semester]) semData[r.semester] = [];
    semData[r.semester].push(r.marks);
  });
  const barData = Object.entries(semData).map(([s, marks]) => ({
    semester: "Sem " + s,
    avg: Math.round(marks.reduce((a,b)=>a+b,0)/marks.length)
  }));

  if (loading) return <div style={{ display:"flex", justifyContent:"center", padding:60 }}><Spinner /></div>;

  return (
    <div>
      {toast && <Toast msg={toast} onClose={() => setToast("")} />}
      <div className="page-header" style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", flexWrap:"wrap", gap:12 }}>
        <div>
          <div className="page-title">📚 Academic Records</div>
          <div className="page-desc">Your subject-wise performance with AI-driven CGPA prediction</div>
        </div>
        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
          <button className="btn btn-outline btn-sm" onClick={() => { setScreenshotUrl(null); setScanNote(""); setRawScanText(""); setShowImport(true); }}>
            📝 Bulk Add (no screenshot)
          </button>
          <label className="btn btn-outline btn-sm" style={{ cursor:"pointer" }}>
            🎓 Import from College Portal
            <input type="file" accept="image/*" onChange={handleScreenshotSelect} style={{ display:"none" }} />
          </label>
        </div>
      </div>

      {showImport && (
        <div className="card" style={{ marginBottom:24, border:"1px solid var(--accent)" }}>
          <div className="card-title" style={{ marginBottom:4 }}>
            {screenshotUrl ? "🎓 Import from College Portal Screenshot" : "📝 Bulk Add Multiple Records"}
          </div>
          <div className="card-sub" style={{ marginBottom:16 }}>
            {screenshotUrl
              ? "Your screenshot stays in your browser only — it's never uploaded or saved anywhere."
              : "Add multiple subjects at once instead of one at a time. Fill in the rows below and save."}
          </div>

          {scanning && (
            <div style={{ display:"flex", alignItems:"center", gap:10, padding:"14px 0", color:"var(--accent2)" }}>
              <Spinner /> {scanNote}
            </div>
          )}
          {!scanning && scanNote && (
            <div style={{
              fontSize:13, padding:"10px 14px", borderRadius:8, marginBottom:16,
              background:"rgba(34,211,238,.08)", border:"1px solid var(--accent2)", color:"var(--accent2)"
            }}>
              ℹ️ {scanNote}
            </div>
          )}

          {!scanning && rawScanText && (
            <details style={{ marginBottom:16 }}>
              <summary style={{ cursor:"pointer", fontSize:12, color:"var(--muted)" }}>
                🔍 View raw scanned text (for debugging)
              </summary>
              <pre style={{
                fontSize:11, whiteSpace:"pre-wrap", background:"var(--surface)",
                border:"1px solid var(--border)", borderRadius:8, padding:10, marginTop:8,
                maxHeight:200, overflowY:"auto", color:"var(--muted)"
              }}>{rawScanText}</pre>
            </details>
          )}

          <div style={{ display:"grid", gridTemplateColumns: screenshotUrl ? "1fr 1.4fr" : "1fr", gap:20 }}>
            {screenshotUrl && (
              <div>
                <img src={screenshotUrl} alt="College portal screenshot" style={{ width:"100%", borderRadius:10, border:"1px solid var(--border)" }} />
              </div>
            )}
            <div style={{ opacity: scanning ? 0.5 : 1, pointerEvents: scanning ? "none" : "auto" }}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 2fr 0.8fr 0.9fr 0.9fr auto", gap:8, marginBottom:6, padding:"0 2px" }}>
                {["Subject Code","Subject Name","Credits","Grade","Semester",""].map(h => (
                  <div key={h} style={{ fontSize:11, color:"var(--muted)", fontWeight:600 }}>{h}</div>
                ))}
              </div>
              {importRows.map((row, i) => (
                <div key={i} style={{ display:"grid", gridTemplateColumns:"1fr 2fr 0.8fr 0.9fr 0.9fr auto", gap:8, marginBottom:8, alignItems:"center" }}>
                  <input className="form-input" placeholder="e.g. 23CSH-307" value={row.subject_code}
                    onChange={e => updateImportRow(i, "subject_code", e.target.value)} />
                  <input className="form-input" placeholder="Subject name" value={row.subject}
                    onChange={e => updateImportRow(i, "subject", e.target.value)} />
                  <input className="form-input" type="number" step="0.5" min="0" placeholder="3.00" value={row.credits}
                    onChange={e => updateImportRow(i, "credits", e.target.value)} />
                  <select className="form-select" value={row.grade} onChange={e => updateImportRow(i, "grade", e.target.value)}>
                    {["O","A+","A","B+","B","C+","C","D","F","Qualified","Pass"].map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                  <select className="form-select" value={row.semester} onChange={e => updateImportRow(i, "semester", e.target.value)}>
                    {[1,2,3,4,5,6,7,8].map(s => <option key={s} value={s}>Sem {s}</option>)}
                  </select>
                  <button className="btn btn-outline btn-sm" onClick={() => removeImportRow(i)} disabled={importRows.length === 1}>✕</button>
                </div>
              ))}
              <button className="btn btn-outline btn-sm" onClick={addImportRow} style={{ marginTop:4 }}>+ Add Row</button>
              <div style={{ display:"flex", gap:10, marginTop:16 }}>
                <button className="btn btn-primary btn-sm" onClick={submitImport} disabled={importing || scanning}>
                  {importing ? <Spinner /> : "✅ Save All to My Profile"}
                </button>
                <button className="btn btn-outline btn-sm" onClick={() => { setShowImport(false); setScreenshotUrl(null); setScanNote(""); setRawScanText(""); }}>
                  Cancel
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      <div className="grid-2" style={{ marginBottom:24 }}>
        <div className="card">
          <div className="card-title">🤖 AI CGPA Prediction (XAI)</div>
          <div className="card-sub" style={{ marginBottom:16 }}>Explainable factors behind your prediction</div>
          {prediction && <>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
              <div>
                <div style={{ fontSize:13, color:"var(--muted)" }}>Predicted Next Semester CGPA</div>
                <div style={{ fontSize:36, fontWeight:900, color:"var(--accent3)" }}>{prediction.predicted_cgpa}</div>
              </div>
              <div style={{ textAlign:"right" }}>
                <div style={{ fontSize:12, color:"var(--muted)" }}>Confidence</div>
                <div style={{ fontSize:22, fontWeight:800, color:"var(--green)" }}>{Math.round(prediction.confidence*100)}%</div>
              </div>
            </div>
            {(prediction.factors || []).map((f, i) => <XAIFactor key={i} factor={f} />)}
          </>}
        </div>

        <div className="card">
          <div className="card-title" style={{ marginBottom:16 }}>📊 Semester-wise Average</div>
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={barData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#243047" />
              <XAxis dataKey="semester" tick={{ fill:"#64748b", fontSize:11 }} />
              <YAxis domain={[0,100]} tick={{ fill:"#64748b", fontSize:11 }} />
              <Tooltip contentStyle={{ background:"#1a2235", border:"1px solid #243047", borderRadius:8 }} />
              <Bar dataKey="avg" fill="url(#barGrad)" radius={[6,6,0,0]} />
              <defs>
                <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#6366f1" />
                  <stop offset="100%" stopColor="#a78bfa" />
                </linearGradient>
              </defs>
            </BarChart>
          </ResponsiveContainer>

          <div className="divider" />
          <div className="card-title" style={{ marginBottom:12 }}>➕ Add Record</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
            <div className="form-group" style={{ margin:0 }}>
              <label className="form-label">Subject Code</label>
              <input className="form-input" value={form.subject_code} onChange={e => setForm({...form, subject_code: e.target.value})} placeholder="e.g. 23CSH-307" />
            </div>
            <div className="form-group" style={{ margin:0 }}>
              <label className="form-label">Subject Name</label>
              <input className="form-input" value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} placeholder="e.g. Cloud Computing" />
            </div>
            <div className="form-group" style={{ margin:0 }}>
              <label className="form-label">Credits</label>
              <input className="form-input" type="number" step="0.5" min="0" value={form.credits} onChange={e => setForm({...form, credits: e.target.value})} placeholder="e.g. 3.00" />

                {[1,2,3,4,5,6,7,8].map(s => <option key={s} value={s}>Semester {s}</option>)}

          <button className="btn btn-primary btn-sm" style={{ marginTop:12 }} onClick={addRecord}>Add Record</button>

              <tr style={{ borderBottom:"1px solid var(--border)" }}>
                {["Subject Code","Subject Name","Credits","Semester","Grade"].map(h =>
                  <th key={h} style={{ padding:"10px 14px", textAlign:"left", color:"var(--muted)", fontWeight:600, whiteSpace:"nowrap" }}>{h}</th>
                )}
              </tr>
            </thead>
            <tbody>
              {records.map(r => {
                const grade = r.grade || "—";
                const gColor = ["O","A+","A"].includes(grade) ? "var(--green)"
                             : ["B+","B","Qualified","Pass"].includes(grade) ? "var(--accent2)"
                             : ["C+","C"].includes(grade) ? "var(--yellow)"
                             : "var(--red)";
                return (
                  <tr key={r.id} style={{ borderBottom:"1px solid var(--border)" }}>
                    <td style={{ padding:"10px 14px", color:"var(--muted)" }}>{r.subject_code || "—"}</td>
                    <td style={{ padding:"10px 14px", fontWeight:600 }}>{r.subject}</td>
                    <td style={{ padding:"10px 14px" }}>{r.credits || "—"}</td>
                    <td style={{ padding:"10px 14px" }}>Sem {r.semester}</td>
                    <td style={{ padding:"10px 14px", color:gColor, fontWeight:800 }}>{grade}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── SKILLS PAGE ───────────────────────────────────────────────────────────────
function SkillsPage() {
  const [skills, setSkills] = useState([]);
  const [growthPred, setGrowthPred] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ skill_name:"", proficiency:50, category:"Programming", hours:0 });
  const [toast, setToast] = useState("");

  useEffect(() => {
    Promise.all([api("/skills"), api("/predict/skills")]).then(([s, p]) => {
      setSkills(s?.skills || []);
      setGrowthPred(p?.predictions || []);
      setLoading(false);
    });
  }, []);

  async function addSkill() {
    if (!form.skill_name) return;
    await api("/skills/add", "POST", { ...form, proficiency: +form.proficiency, hours: +form.hours });
    setToast("Skill added successfully!");
    const [s, p] = await Promise.all([api("/skills"), api("/predict/skills")]);
    setSkills(s?.skills || []);
    setGrowthPred(p?.predictions || []);
    setForm({ skill_name:"", proficiency:50, category:"Programming", hours:0 });
  }

  // Radar chart data
  const categories = {};
  skills.forEach(s => {
    if (!categories[s.category]) categories[s.category] = [];
    categories[s.category].push(s.proficiency);
  });
  const radarData = Object.entries(categories).map(([cat, vals]) => ({
    subject: cat, A: Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)
  }));

  // Growth chart for top 5
  const top5Growth = growthPred.slice(0, 5).map(p => ({
    name: p.skill.length > 12 ? p.skill.slice(0,10)+"…" : p.skill,
    "Now": p.current, "3M": p.month_3, "6M": p.month_6, "12M": p.month_12
  }));

  if (loading) return <div style={{ display:"flex", justifyContent:"center", padding:60 }}><Spinner /></div>;

  return (
    <div>
      {toast && <Toast msg={toast} onClose={() => setToast("")} />}
      <div className="page-header">
        <div className="page-title">⚡ Skills & Growth Prediction</div>
        <div className="page-desc">Track proficiency levels and see AI-predicted growth over 3, 6, 12 months</div>
      </div>

      <div className="grid-2" style={{ marginBottom:24 }}>
        <div className="card">
          <div className="card-title" style={{ marginBottom:16 }}>🕸️ Skills Radar</div>
          <ResponsiveContainer width="100%" height={240}>
            <RadarChart data={radarData}>
              <PolarGrid stroke="#243047" />
              <PolarAngleAxis dataKey="subject" tick={{ fill:"#64748b", fontSize:11 }} />
              <Radar name="Proficiency" dataKey="A" stroke="#6366f1" fill="#6366f1" fillOpacity={0.3} />
            </RadarChart>
          </ResponsiveContainer>
        </div>

        <div className="card">
          <div className="card-title" style={{ marginBottom:16 }}>📈 Growth Forecast (12M)</div>
          <ResponsiveContainer width="100%" height={240}>
            <LineChart data={top5Growth}>
              <CartesianGrid strokeDasharray="3 3" stroke="#243047" />
              <XAxis dataKey="name" tick={{ fill:"#64748b", fontSize:10 }} />
              <YAxis domain={[0,100]} tick={{ fill:"#64748b", fontSize:10 }} />
              <Tooltip contentStyle={{ background:"#1a2235", border:"1px solid #243047", borderRadius:8 }} />
              <Legend wrapperStyle={{ fontSize:11 }} />
              <Line type="monotone" dataKey="Now" stroke="#64748b" strokeWidth={2} dot={false} />
              <Line type="monotone" dataKey="3M" stroke="#f59e0b" strokeWidth={2} dot={false} />
              <Line type="monotone" dataKey="6M" stroke="#22d3ee" strokeWidth={2} dot={false} />
              <Line type="monotone" dataKey="12M" stroke="#10b981" strokeWidth={2} dot={false} strokeDasharray="5 3" />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-title" style={{ marginBottom:14 }}>🎯 All Skills</div>
          {skills.map((s, i) => (
            <div className="skill-pill" key={i}>
              <div>
                <div className="skill-name">{s.skill_name}</div>
                <div style={{ fontSize:10, color:"var(--muted)" }}>{s.category} • {s.hours_practiced}h practiced</div>
              </div>
              <div className="progress-bar" style={{ flex:1, margin:0 }}>
                <div className="progress-fill" style={{
                  width: s.proficiency + "%",
                  background: s.proficiency >= 80 ? "linear-gradient(90deg,var(--green),#34d399)" :
                              s.proficiency >= 60 ? "linear-gradient(90deg,var(--accent),var(--accent2))" :
                              "linear-gradient(90deg,var(--yellow),#fbbf24)"
                }} />
              </div>
              <span className="skill-pct">{s.proficiency}%</span>
            </div>
          ))}
        </div>

        <div className="card">
          <div className="card-title" style={{ marginBottom:12 }}>➕ Add Skill</div>
          <div className="form-group">
            <label className="form-label">Skill Name</label>
            <input className="form-input" value={form.skill_name} onChange={e => setForm({...form, skill_name: e.target.value})} placeholder="e.g. Kubernetes" />
          </div>
          <div className="form-group">
            <label className="form-label">Proficiency: {form.proficiency}%</label>
            <input type="range" min={0} max={100} value={form.proficiency} onChange={e => setForm({...form, proficiency: e.target.value})} style={{ width:"100%", accentColor:"var(--accent)" }} />
          </div>
          <div className="form-group">
            <label className="form-label">Category</label>
            <select className="form-select" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
              {["Programming","AI/ML","Database","Frontend","Backend","Cloud","CS Fundamentals","Soft Skills","Architecture"].map(c =>
                <option key={c} value={c}>{c}</option>
              )}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Hours Practiced</label>
            <input className="form-input" type="number" value={form.hours} onChange={e => setForm({...form, hours: e.target.value})} placeholder="100" />

          <div className="divider" />
          <div className="card-title" style={{ marginBottom:12 }}>🔮 Growth Predictions</div>
          {growthPred.slice(0,4).map((p,i) => (
            <div key={i} style={{ padding:"10px 0", borderBottom:"1px solid var(--border)" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                <span style={{ fontSize:13, fontWeight:700 }}>{p.skill}</span>
                <span style={{ fontSize:11, color:"var(--muted)" }}>{p.category}</span>
              </div>
              <div style={{ display:"flex", gap:12, fontSize:11 }}>
                <span>Now: <b style={{ color:"var(--subtle)" }}>{p.current}%</b></span>
                <span>3M: <b style={{ color:"var(--yellow)" }}>{p.month_3}%</b></span>
                <span>6M: <b style={{ color:"var(--accent2)" }}>{p.month_6}%</b></span>
                <span>12M: <b style={{ color:"var(--green)" }}>{p.month_12}%</b></span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── SCENARIO / WHAT-IF PAGE ────────────────────────────────────────────────────
function ScenarioPage() {
  const SCENARIOS = [
    { type:"add_skill",      icon:"🧠", label:"Learn a New Skill",    desc:"What if I master a new technology?" },
    { type:"improve_cgpa",   icon:"📈", label:"Improve CGPA",         desc:"What if I score higher this semester?" },
    { type:"add_activity",   icon:"🏆", label:"Add an Activity",      desc:"What if I do a hackathon or internship?" },
    { type:"change_goal",    icon:"🎯", label:"Change Career Goal",   desc:"What if I target a different role?" },
  ];
  const [selected, setSelected] = useState("add_skill");
  const [params, setParams] = useState({});
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  async function simulate() {
    setLoading(true); setResult(null);
    const res = await api("/scenario/simulate", "POST", { scenario_type: selected, params });
    setResult(res); setLoading(false);
  }

  function ParamForm() {
    if (selected === "add_skill") return (
      <div>
        <div className="form-group">
          <label className="form-label">Skill Name</label>
          <select className="form-select" onChange={e => setParams({...params, skill_name: e.target.value})}>
            {["Machine Learning","System Design","React","AWS","Kubernetes","DSA","Docker","Golang","Flutter","Blockchain"].map(s =>
              <option key={s} value={s}>{s}</option>
            )}
          </select>
        </div>
        <div className="form-group">
          <label className="form-label">Target Proficiency: {params.proficiency || 70}%</label>
          <input type="range" min={30} max={100} value={params.proficiency || 70} style={{ width:"100%", accentColor:"var(--accent)" }}
            onChange={e => setParams({...params, proficiency: +e.target.value})} />
        </div>
        <div className="form-group">
          <label className="form-label">Hours to Invest</label>
          <input className="form-input" type="number" placeholder="100" onChange={e => setParams({...params, hours: +e.target.value})} />
        </div>
      </div>
    );
    if (selected === "improve_cgpa") return (
      <div className="form-group">
        <label className="form-label">Target CGPA: {params.target_cgpa || 9.0}</label>
        <input type="range" min={6} max={10} step={0.1} value={params.target_cgpa || 9.0} style={{ width:"100%", accentColor:"var(--accent)" }}
          onChange={e => setParams({...params, target_cgpa: +e.target.value})} />
      </div>
    );
    if (selected === "add_activity") return (
      <div className="form-group">
        <label className="form-label">Activity Type</label>
        <select className="form-select" onChange={e => setParams({...params, activity_type: e.target.value})}>
          {["hackathon","internship","certification","project","research","open_source"].map(a =>
            <option key={a} value={a}>{a.charAt(0).toUpperCase() + a.slice(1)}</option>
          )}
        </select>
      </div>
    );
    if (selected === "change_goal") return (
      <div className="form-group">
        <label className="form-label">Target Role</label>
        <select className="form-select" onChange={e => setParams({...params, role: e.target.value})}>
          {["ML Engineer","Frontend Developer","Backend Developer","Data Scientist","DevOps Engineer","Full Stack"].map(r =>
            <option key={r} value={r}>{r}</option>
          )}
        </select>
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <div className="page-title">🔮 What-If Scenario Simulator</div>
        <div className="page-desc">Predict how different decisions impact your placement readiness and career trajectory</div>
      </div>

      <div className="grid-2" style={{ marginBottom:24 }}>
        <div>
          <div className="card-title" style={{ marginBottom:14 }}>Choose a Scenario</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:20 }}>
            {SCENARIOS.map(s => (
              <div key={s.type} className={`scenario-card ${selected === s.type ? "selected" : ""}`}
                   onClick={() => { setSelected(s.type); setParams({}); setResult(null); }}>
                <div className="scenario-icon">{s.icon}</div>
                <div style={{ fontSize:13, fontWeight:700 }}>{s.label}</div>
                <div style={{ fontSize:11, color:"var(--muted)", marginTop:4 }}>{s.desc}</div>
              </div>
            ))}
          </div>

          <div className="card">
            <div className="card-title" style={{ marginBottom:14 }}>Configure Scenario</div>
            <ParamForm />
            <button className="btn btn-primary" style={{ width:"100%" }} onClick={simulate} disabled={loading}>
              {loading ? <><Spinner /> Running simulation…</> : "🚀 Run Simulation"}
            </button>
          </div>
        </div>

        <div>
          {!result && !loading && (
            <div className="card" style={{ textAlign:"center", padding:50 }}>
              <div style={{ fontSize:48 }}>🔮</div>
              <div style={{ fontSize:16, fontWeight:700, marginTop:14 }}>Configure & Simulate</div>
              <div style={{ fontSize:13, color:"var(--muted)", marginTop:8 }}>
                Choose a scenario, adjust the parameters,<br/>and run the AI prediction engine
              </div>
            </div>
          )}

          {loading && (
            <div className="card" style={{ textAlign:"center", padding:50 }}>
              <Spinner />
              <div style={{ fontSize:14, color:"var(--muted)", marginTop:16 }}>Running AI prediction engine…</div>
            </div>
          )}

          {result && (
            <div className="card">
              <div className="card-title" style={{ marginBottom:4 }}>📊 Simulation Result</div>
              <div className="card-sub" style={{ marginBottom:18 }}>{result.scenario}</div>

              {result.current_placement_score !== undefined && (
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:18 }}>
                  <div style={{ background:"var(--surface)", borderRadius:"12px", padding:14 }}>
                    <div style={{ fontSize:12, color:"var(--muted)" }}>Current Score</div>
                    <div style={{ fontSize:28, fontWeight:900, color:"var(--subtle)" }}>
                      {result.current_placement_score}%
                    </div>
                  </div>
                  <div style={{ background:"linear-gradient(135deg,rgba(99,102,241,.15),rgba(34,211,238,.1))", borderRadius:10, padding:14, border:"1px solid var(--accent)" }}>
                    <div style={{ fontSize:12, color:"var(--muted)" }}>Predicted Score</div>
                    <div style={{ fontSize:28, fontWeight:900, color:"var(--accent2)" }}>
                      {result.new_placement_score}%
                    </div>
                  </div>
                </div>
              )}

              {result.delta !== undefined && (
                <div style={{ background: result.delta > 0 ? "rgba(16,185,129,.1)" : "rgba(239,68,68,.1)",
                              border: `1px solid ${result.delta > 0 ? "var(--green)" : "var(--red)"}`,
                              borderRadius:10, padding:14, marginBottom:16, textAlign:"center" }}>
                  <div style={{ fontSize:24, fontWeight:900, color: result.delta > 0 ? "var(--green)" : "var(--red)" }}>
                    {result.delta > 0 ? "+" : ""}{result.delta} points
                  </div>
                  <div style={{ fontSize:12, color:"var(--muted)" }}>Estimated improvement</div>
                </div>
              )}

              {result.role_match_percentage !== undefined && (
                <div style={{ marginBottom:16 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                    <span style={{ fontSize:13 }}>Role Match</span>
                    <span style={{ fontWeight:800, color:"var(--accent2)" }}>{result.role_match_percentage}%</span>
                  </div>
                  <div className="progress-bar" style={{ height:10 }}>
                    <div className="progress-fill" style={{ width: result.role_match_percentage + "%", background: "linear-gradient(90deg,var(--accent),var(--accent2))" }} />
                  </div>
                  {result.matched_skills?.length > 0 && (
                    <div style={{ marginTop:10, fontSize:12 }}>
                      <span style={{ color:"var(--green)" }}>✓ Matched:</span> {result.matched_skills.join(", ")}
                    </div>
                  )}
                  {result.skill_gaps?.length > 0 && (
                    <div style={{ marginTop:4, fontSize:12 }}>
                      <span style={{ color:"var(--red)" }}>✗ Gaps:</span> {result.skill_gaps.join(", ")}
                    </div>
                  )}
                </div>
              )}

              {result.time_investment && (
                <div style={{ fontSize:12, color:"var(--muted)", marginBottom:14 }}>
                  ⏱ {result.time_investment}
                </div>
              )}

              {result.recommendation && (
                <div style={{ background:"rgba(99,102,241,.1)", borderRadius:10, padding:12, marginBottom:16, fontSize:13 }}>
                  💡 {result.recommendation}
                </div>
              )}

              <div className="card-title" style={{ marginBottom:10, fontSize:13 }}>🧠 XAI Reasoning</div>
              {(result.xai_reasoning || []).map((r, i) => (
                <div key={i} style={{ display:"flex", gap:8, fontSize:12, color:"var(--subtle)", marginBottom:6 }}>
                  <span style={{ color:"var(--accent2)" }}>→</span>
                  <span>{r}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

                <div style={{ fontSize:13, fontWeight:700 }}>{a.description}</div>
                <div style={{ fontSize:11, color:"var(--muted)" }}>{a.date}</div>
              </div>
            </div>
            <div style={{ textAlign:"right" }}>
              <span className="badge badge-blue">{a.activity_type}</span>
              <div style={{ fontSize:13, color:"var(--green)", fontWeight:700, marginTop:4 }}>+{a.impact_score}/10</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── CAREER PAGE ───────────────────────────────────────────────────────────────
function CareerPage() {
  const [goals, setGoals] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ target_role:"", target_company:"", target_salary:"", target_year:2025 });
  const [toast, setToast] = useState("");

  useEffect(() => {
    api("/career-goals").then(r => { setGoals(r?.goals || []); setLoading(false); });
  }, []);

  async function addGoal() {
    if (!form.target_role) return;
    await api("/career-goals/add", "POST", { ...form, target_salary: +form.target_salary });
    setToast("Career goal added!");
    const r = await api("/career-goals");
    setGoals(r?.goals || []);
    setForm({ target_role:"", target_company:"", target_salary:"", target_year:2025 });
  }

  const ROLE_SKILLS = {
    "ML Engineer": ["Python","Machine Learning","TensorFlow/PyTorch","SQL","Statistics","Cloud (AWS/GCP)"],
    "Software Engineer": ["DSA","System Design","Python/Java","SQL","REST APIs","Git"],
    "Data Scientist": ["Python","SQL","Machine Learning","Statistics","Visualization","Communication"],
    "Frontend Developer": ["React","JavaScript","CSS","HTML","TypeScript","Git"],
    "DevOps Engineer": ["Docker","Kubernetes","AWS","CI/CD","Linux","Terraform"],
  };

  if (loading) return <div style={{ display:"flex", justifyContent:"center", padding:60 }}><Spinner /></div>;

  return (
    <div>
      {toast && <Toast msg={toast} onClose={() => setToast("")} />}
      <div className="page-header">
        <div className="page-title">🎯 Career Goals & Roadmap</div>
        <div className="page-desc">Set career aspirations and get AI-generated skill roadmaps for each role</div>
      </div>

      <div className="grid-2">
        <div>
          <div className="card" style={{ marginBottom:20 }}>
            <div className="card-title" style={{ marginBottom:14 }}>➕ Set Career Goal</div>
            <div className="form-group">
              <label className="form-label">Target Role</label>
              <select className="form-select" value={form.target_role} onChange={e => setForm({...form, target_role: e.target.value})}>
                <option value="">Select role…</option>
                {Object.keys(ROLE_SKILLS).map(r => <option key={r} value={r}>{r}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Target Company</label>
              <input className="form-input" value={form.target_company} onChange={e => setForm({...form, target_company: e.target.value})} placeholder="e.g. Google, Amazon, TCS" />
            </div>
            <div className="form-group">
              <label className="form-label">Expected CTC (₹/year)</label>
              <input className="form-input" type="number" value={form.target_salary} onChange={e => setForm({...form, target_salary: e.target.value})} placeholder="1500000" />
            </div>
            <div className="form-group">
              <label className="form-label">Target Year</label>
              <select className="form-select" value={form.target_year} onChange={e => setForm({...form, target_year: +e.target.value})}>
                {[2025,2026,2027,2028].map(y => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
            <button className="btn btn-primary" style={{ width:"100%" }} onClick={addGoal}>Add Goal</button>
          </div>

          {form.target_role && ROLE_SKILLS[form.target_role] && (
            <div className="card">
              <div className="card-title" style={{ marginBottom:12 }}>🗺️ Skill Roadmap for {form.target_role}</div>
              {ROLE_SKILLS[form.target_role].map((s, i) => (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:"1px solid var(--border)" }}>
                  <div style={{ width:24, height:24, borderRadius:6, background:"var(--accent)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, fontWeight:800, color:"#fff" }}>{i+1}</div>
                  <span style={{ fontSize:13, fontWeight:600 }}>{s}</span>
                </div>
              ))}
            </div>
          )}
        </div>

        <div>
          <div className="card-title" style={{ marginBottom:14 }}>📌 Your Goals</div>
          {goals.length === 0 && <div style={{ color:"var(--muted)", textAlign:"center", padding:40 }}>No goals yet. Add your first goal!</div>}
          {goals.map((g, i) => (
            <div key={i} className="card" style={{ marginBottom:14 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                <div>
                  <div style={{ fontSize:16, fontWeight:800 }}>{g.target_role}</div>
                  <div style={{ fontSize:13, color:"var(--muted)" }}>{g.target_company} • {g.target_year}</div>
                </div>
                <span className="badge badge-blue">Priority #{i+1}</span>
              </div>
              {g.target_salary > 0 && (
                <div style={{ marginTop:10, padding:"8px 12px", background:"var(--surface)", borderRadius:8 }}>
                  <span style={{ fontSize:12, color:"var(--muted)" }}>Target CTC: </span>
                  <span style={{ fontSize:15, fontWeight:800, color:"var(--green)" }}>
                    ₹{(g.target_salary / 100000).toFixed(1)} LPA
                  </span>
                </div>
              )}
              {ROLE_SKILLS[g.target_role] && (
                <div style={{ marginTop:10 }}>
                  <div style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>Required Skills:</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                    {ROLE_SKILLS[g.target_role].map((s,j) => (
                      <span key={j} className="badge badge-cyan">{s}</span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ──────────────────────────────────────────────────────────────────
const NAV = [
  { id:"dashboard",  icon:"⊞", label:"Dashboard" },
  { id:"academic",   icon:"📚", label:"Academics" },
  { id:"skills",     icon:"⚡", label:"Skills" },
  { id:"placement",  icon:"🚀", label:"Placement" },
  { id:"scenario",   icon:"🔮", label:"What-If Simulator" },
  { id:"career",     icon:"🎯", label:"Career Goals" },
];

function App() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState("dashboard");

  function handleLogin(u) {
    CURRENT_USER_ID = u.id;   // scope all subsequent API calls to this account
    setUser(u);
    setPage("dashboard");
  }

  function handleLogout() {
    CURRENT_USER_ID = null;
    setUser(null);
  }

  const PAGE_MAP = {
    dashboard: <Dashboard user={user} />,
    academic:  <AcademicPage />,
    skills:    <SkillsPage />,
    placement: <PlacementPage />,
    scenario:  <ScenarioPage />,
    career:    <CareerPage />,
  };

  if (!user) return <LoginPage onLogin={handleLogin} />;

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="logo">
          <div className="logo-title">🧬 NextTwin</div>
          <div className="logo-sub">DIGITAL ACADEMIC TWIN</div>
        </div>
        <nav className="nav-section">
          <div className="nav-label">Navigation</div>
          {NAV.map(n => (
            <div key={n.id} className={`nav-item ${page === n.id ? "active" : ""}`} onClick={() => setPage(n.id)}>
              <span className="nav-icon">{n.icon}</span>
              {n.label}
            </div>
          ))}
        </nav>
        <div style={{ flex:1 }} />
        <div className="user-card">
          <div style={{ display:"flex", gap:10, alignItems:"center" }}>
            <div className="user-avatar">{user?.name?.charAt(0) || "A"}</div>
            <div>
              <div className="user-name">{user?.name}</div>
              <div className="user-meta">{user?.branch} • Sem {user?.semester}</div>
            </div>
          </div>
          <button className="btn btn-outline btn-sm" style={{ width:"100%", marginTop:10 }} onClick={handleLogout}>
            Sign Out
          </button>
        </div>
      </aside>
      <main className="main">
        {PAGE_MAP[page] || <Dashboard user={user} />}
      </main>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
